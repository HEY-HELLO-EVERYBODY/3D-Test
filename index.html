<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MizaxEngine - 3D Dummy & Baseplate</title>
    <!-- Three.js Utama -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- Library Kontrol Kamera (OrbitControls buat Geser/Zoom di HP) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body style="margin: 0; background-color: #080808; overflow: hidden;">

    <script>
        // 1. SCENE, KAMERA, & RENDERER
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a0a);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 5, 8); // Posisi awal kamera

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. KONTROL KAMERA INTERAKTIF (Bisa diusap pakai jari)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true; // Gerakan kamera halus
        controls.target.set(0, 2.5, 0); // Kamera fokus ke dada dummy

        // 3. PENCAHAYAAN (LIGHTING)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7); // Cahaya ruangan
        scene.add(ambientLight);

        const redSun = new THREE.DirectionalLight(0xff2a2a, 1.5); // Lampu bayangan merah Cyberpunk
        redSun.position.set(5, 10, 5);
        scene.add(redSun);

        // 4. ROBLOX BASEPLATE & GRID
        const baseplateGeo = new THREE.BoxGeometry(20, 0.2, 20);
        const baseplateMat = new THREE.MeshStandardMaterial({ color: 0x1f1f1f, roughness: 0.8 });
        const baseplate = new THREE.Mesh(baseplateGeo, baseplateMat);
        baseplate.position.y = -0.1;
        scene.add(baseplate);

        // Garis Grid Merah khas Roblox Baseplate
        const gridHelper = new THREE.GridHelper(20, 20, 0xff2a2a, 0x444444);
        gridHelper.position.y = 0.01;
        scene.add(gridHelper);

        // 5. STRUKTUR DUMMY R6 (GROUP)
        const dummy = new THREE.Group();

        // Material Tubuh
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.5 });
        const headMat = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.5 });

        // A. Torso / Badan (Ukuran: 2 x 2 x 1)
        const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), bodyMat);
        torso.position.y = 3;
        dummy.add(torso);

        // B. Head / Kepala (Ukuran: 1.25 x 1.25 x 1.25)
        const head = new THREE.Mesh(new THREE.BoxGeometry(1.25, 1.25, 1.25), headMat);
        head.position.set(0, 4.65, 0);
        dummy.add(head);

        // C. Tangan Kiri & Kanan (Ukuran: 1 x 2 x 1)
        const armGeo = new THREE.BoxGeometry(1, 2, 1);
        
        const leftArm = new THREE.Mesh(armGeo, bodyMat);
        leftArm.position.set(-1.55, 3, 0);
        dummy.add(leftArm);

        const rightArm = new THREE.Mesh(armGeo, bodyMat);
        rightArm.position.set(1.55, 3, 0);
        dummy.add(rightArm);

        // D. Kaki Kiri & Kanan (Ukuran: 1 x 2 x 1)
        const legGeo = new THREE.BoxGeometry(1, 2, 1);

        const leftLeg = new THREE.Mesh(legGeo, bodyMat);
        leftLeg.position.set(-0.52, 1, 0);
        dummy.add(leftLeg);

        const rightLeg = new THREE.Mesh(legGeo, bodyMat);
        rightLeg.position.set(0.52, 1, 0);
        dummy.add(rightLeg);

        scene.add(dummy);

        // 6. ANIMATE LOOP & RESIZE HANDLER
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Update posisi kamera pas diusap
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
