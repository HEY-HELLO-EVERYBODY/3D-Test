<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">

<title>MizaxEngine — R6 Animation Studio</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
overflow:hidden;
background:#080808;
color:#eee;
font-family:Arial,Helvetica,sans-serif;
user-select:none;
}

#topbar{
position:absolute;
left:0;
right:0;
top:0;
height:44px;
z-index:20;
display:flex;
align-items:center;
justify-content:space-between;
padding:0 10px;
background:linear-gradient(90deg,#0b0b0b,#151515);
border-bottom:1px solid #3b1115;
box-shadow:0 2px 15px #000;
}

.logo{
font-size:14px;
font-weight:bold;
color:#ff2638;
letter-spacing:.5px;
white-space:nowrap;
}

.logo span{
color:#777;
font-weight:normal;
}

.toolbar{
display:flex;
gap:5px;
align-items:center;
}

button{
border:1px solid #3b3b3b;
background:#181818;
color:#ddd;
padding:7px 10px;
border-radius:5px;
font-size:11px;
cursor:pointer;
}

button:hover{
background:#252525;
border-color:#92202a;
}

button:active{
transform:scale(.96);
}

button.red{
background:#7d1720;
border-color:#c92a37;
color:white;
}

button.red:hover{
background:#a31e29;
}

button.active{
background:#b51f2a;
border-color:#ff4350;
}

#viewport{
position:absolute;
left:0;
right:0;
top:44px;
bottom:220px;
background:#0b0b0b;
}

canvas{
display:block;
}

#loading{
position:absolute;
z-index:100;
left:50%;
top:50%;
transform:translate(-50%,-50%);
background:#111;
border:1px solid #b51f2a;
box-shadow:0 0 30px #000;
padding:18px 25px;
border-radius:8px;
color:#ff3444;
font-size:12px;
text-align:center;
}

#status{
position:absolute;
left:10px;
bottom:10px;
padding:6px 10px;
background:rgba(8,8,8,.85);
border:1px solid #361014;
border-radius:4px;
color:#888;
font-size:10px;
z-index:5;
}

#status b{
color:#ff3444;
}

#animationPanel{
position:absolute;
left:0;
right:0;
bottom:0;
height:220px;
display:flex;
background:#0c0c0c;
border-top:1px solid #401217;
z-index:20;
}

#bonePanel{
width:230px;
min-width:180px;
background:#0b0b0b;
border-right:1px solid #321013;
display:flex;
flex-direction:column;
}

.panelTitle{
height:34px;
display:flex;
align-items:center;
padding:0 10px;
color:#aaa;
font-size:10px;
font-weight:bold;
letter-spacing:1px;
background:#121212;
border-bottom:1px solid #2b0e11;
}

#boneTree{
flex:1;
overflow-y:auto;
padding:4px;
}

.bone{
height:27px;
display:flex;
align-items:center;
padding:0 8px;
border-radius:4px;
color:#aaa;
font-size:11px;
cursor:pointer;
}

.bone:hover{
background:#181818;
color:#fff;
}

.bone.selected{
background:#65151c;
color:#fff;
box-shadow:inset 3px 0 #ff2638;
}

#timeline{
flex:1;
min-width:0;
display:flex;
flex-direction:column;
overflow:hidden;
}

#timelineHeader{
height:34px;
min-height:34px;
display:flex;
align-items:center;
background:#121212;
border-bottom:1px solid #2b0e11;
overflow-x:auto;
}

.frameNumber{
width:30px;
min-width:30px;
text-align:center;
color:#666;
font-size:9px;
}

#tracks{
flex:1;
overflow:auto;
position:relative;
background:repeating-linear-gradient(
90deg,
transparent 0px,
transparent 29px,
rgba(255,255,255,.025) 30px
);
}

.track{
height:27px;
position:relative;
border-bottom:1px solid #181818;
}

.key{
position:absolute;
width:10px;
height:10px;
top:8px;
background:#e52332;
transform:rotate(45deg);
border:1px solid #ff8a91;
box-shadow:0 0 7px #d91d2a;
cursor:pointer;
}

.key:hover{
background:#ff5964;
transform:rotate(45deg) scale(1.3);
}

#controls{
height:45px;
min-height:45px;
display:flex;
align-items:center;
gap:8px;
padding:5px 8px;
background:#101010;
border-top:1px solid #321013;
}

#frameSlider{
flex:1;
accent-color:#e52332;
}

#frameText{
min-width:55px;
text-align:center;
color:#ff3b48;
font-size:11px;
font-weight:bold;
}

#fps{
color:#666;
font-size:10px;
}

@media(max-width:600px){
#topbar{ height:42px; }
.logo{ font-size:11px; }
.toolbar button{ padding:6px; font-size:9px; }
#viewport{ top:42px; bottom:205px; }
#animationPanel{ height:205px; }
#bonePanel{ width:125px; min-width:125px; }
.bone{ font-size:9px; }
#controls button{ padding:6px; font-size:9px; }
}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
</head>

<body>

<div id="loading">
<b>MIZAXENGINE</b><br><br>
Loading R6 Rig & Fixing Head...
</div>

<div id="topbar">
<div class="logo">MIZAX<span>ENGINE</span></div>
<div class="toolbar">
<button id="rotateBtn" class="active">↻ Rotate</button>
<button id="moveBtn">✥ Move</button>
<button id="scaleBtn">⛶ Scale</button>
<button id="keyBtn" class="red">◆ Key</button>
<button id="resetBtn">⟳</button>
</div>
</div>

<div id="viewport"></div>

<div id="status">
<b>MIZAXENGINE</b> • R6 Animation Editor
</div>

<div id="animationPanel">
<div id="bonePanel">
<div class="panelTitle">R6 HIERARCHY</div>
<div id="boneTree"><div style="padding:10px;color:#555">Loading...</div></div>
</div>

<div id="timeline">
<div class="panelTitle">ANIMATION TIMELINE</div>
<div id="timelineHeader"></div>
<div id="tracks"></div>
<div id="controls">
<button id="playBtn" class="red">▶ Play</button>
<button id="stopBtn">■</button>
<span id="frameText">Frame 0</span>
<input id="frameSlider" type="range" min="0" max="60" value="0">
<span id="fps">30 FPS</span>
<button id="clearBtn">Clear</button>
</div>
</div>
</div>

<script>
let scene, camera, renderer, orbit, transform;
let model = null;
let bones = [];
let selectedBone = null;
let keyframes = [];
let currentFrame = 0;
let playing = false;

const FPS = 30;
const MAX_FRAME = 60;

const viewport = document.getElementById("viewport");
const loading = document.getElementById("loading");
const boneTree = document.getElementById("boneTree");
const tracks = document.getElementById("tracks");
const timelineHeader = document.getElementById("timelineHeader");
const slider = document.getElementById("frameSlider");
const frameText = document.getElementById("frameText");

scene = new THREE.Scene();
scene.background = new THREE.Color(0x090909);

camera = new THREE.PerspectiveCamera(45, viewport.clientWidth / viewport.clientHeight, 0.1, 1000);
camera.position.set(0, 3, 7);

renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(viewport.clientWidth, viewport.clientHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;
viewport.appendChild(renderer.domElement);

orbit = new THREE.OrbitControls(camera, renderer.domElement);
orbit.enableDamping = true;
orbit.dampingFactor = .08;
orbit.target.set(0, 1.5, 0);

transform = new THREE.TransformControls(camera, renderer.domElement);
scene.add(transform);
transform.addEventListener("dragging-changed", function(e){
    orbit.enabled = !e.value;
});

// LIGHTING TERANG BENDERANG (Anti Suram)
scene.add(new THREE.AmbientLight(0xffffff, 1.5));

const keyLight = new THREE.DirectionalLight(0xffffff, 2.2);
keyLight.position.set(5, 10, 6);
keyLight.castShadow = true;
scene.add(keyLight);

const redLight = new THREE.PointLight(0xff1728, 4, 15);
redLight.position.set(-4, 3, 2);
scene.add(redLight);

const fillLight = new THREE.DirectionalLight(0xffffff, 1.0);
fillLight.position.set(-5, 5, -5);
scene.add(fillLight);

const grid = new THREE.GridHelper(20, 40, 0x80151d, 0x222222);
scene.add(grid);

const loader = new THREE.FBXLoader();
loader.load("dummy.fbx", function(object){
    model = object;
    model.scale.set(.01, .01, .01);

    // AUTO CENTER & FIX KEPALA PINGGIR/HILANG
    const box = new THREE.Box3().setFromObject(model);
    const center = box.getCenter(new THREE.Vector3());
    model.position.sub(center);
    model.position.y += 1.5;

    scene.add(model);

    model.traverse(function(child){
        if(child.isBone || child.type === "Bone"){
            bones.push(child);
        }
    });

    if(bones.length === 0){
        model.traverse(function(child){
            if(child.isMesh || child.isGroup){
                if(child !== model) bones.push(child);
            }
        });
    }

    model.traverse(function(child){
        if(child.isMesh){
            child.castShadow = true;
            child.receiveShadow = true;
            if(child.material){
                child.material.metalness = 0.0;
                child.material.roughness = 0.5;
                child.material.needsUpdate = true;
            }
        }
    });

    normalizeR6();
    buildUI();

    if(bones.length){
        selectBone(bones[0]);
    }

    loading.style.display = "none";
}, function(xhr){
    if(xhr.total){
        let p = Math.round(xhr.loaded / xhr.total * 100);
        loading.innerHTML = "<b>MIZAXENGINE</b><br><br>Loading FBX " + p + "%";
    }
}, function(error){
    console.error(error);
    loading.innerHTML = "<b>FBX ERROR</b><br><br>dummy.fbx tidak ditemukan.";
});

function normalizeR6(){
    const names = ["Head", "Torso", "Left Arm", "Right Arm", "Left Leg", "Right Leg"];
    let ordered = [];
    names.forEach(function(target){
        let found = bones.find(b => cleanName(b.name) === cleanName(target));
        if(found) ordered.push(found);
    });
    bones.forEach(function(b){
        if(!ordered.includes(b)) ordered.push(b);
    });
    bones = ordered;

    let head = bones.find(b => cleanName(b.name) === "head");
    if(!head) createFallbackHead();
}

function cleanName(name){
    return String(name).toLowerCase().replace(/[\s_\-\.]/g,"");
}

function createFallbackHead(){
    let torso = bones.find(b => cleanName(b.name) === "torso");
    if(!torso) return;
    const geometry = new THREE.BoxGeometry(2,2,2);
    const material = new THREE.MeshStandardMaterial({color:0xd9d9d9, roughness:.8});
    const head = new THREE.Mesh(geometry, material);
    head.name = "Head";
    head.position.set(0,2.1,0);
    torso.add(head);
    bones.unshift(head);
}

function buildUI(){
    boneTree.innerHTML = "";
    tracks.innerHTML = "";
    timelineHeader.innerHTML = "";

    for(let i=0; i<=MAX_FRAME; i++){
        const number = document.createElement("div");
        number.className = "frameNumber";
        number.innerText = i;
        timelineHeader.appendChild(number);
    }

    bones.forEach(function(bone, index){
        const item = document.createElement("div");
        item.className = "bone";
        item.innerHTML = "◆ " + (bone.name || "Part " + index);
        item.onclick = function(){ selectBone(bone); };
        item.dataset.index = index;
        boneTree.appendChild(item);

        const track = document.createElement("div");
        track.className = "track";
        track.dataset.index = index;
        tracks.appendChild(track);
    });

    renderKeys();
}

function selectBone(bone){
    selectedBone = bone;
    transform.attach(bone);

    document.querySelectorAll(".bone").forEach(e => e.classList.remove("selected"));
    const index = bones.indexOf(bone);
    const item = document.querySelector(`.bone[data-index="${index}"]`);
    if(item) item.classList.add("selected");

    document.getElementById("status").innerHTML = "<b>MIZAXENGINE</b> • " + (bone.name || "Part");
}

function setMode(mode){
    transform.setMode(mode);
}

document.getElementById("rotateBtn").onclick = function(){
    setMode("rotate"); setActive(this);
};
document.getElementById("moveBtn").onclick = function(){
    setMode("translate"); setActive(this);
};
document.getElementById("scaleBtn").onclick = function(){
    setMode("scale"); setActive(this);
};

function setActive(button){
    document.querySelectorAll("#topbar button").forEach(b => b.classList.remove("active"));
    button.classList.add("active");
}

document.getElementById("keyBtn").onclick = function(){
    if(!selectedBone) return;
    const existing = keyframes.find(k => k.frame === currentFrame && k.bone === selectedBone);

    if(existing){
        existing.position = selectedBone.position.clone();
        existing.quaternion = selectedBone.quaternion.clone();
        existing.scale = selectedBone.scale.clone();
    } else {
        keyframes.push({
            frame: currentFrame,
            bone: selectedBone,
            position: selectedBone.position.clone(),
            quaternion: selectedBone.quaternion.clone(),
            scale: selectedBone.scale.clone()
        });
    }
    renderKeys();
};

function renderKeys(){
    document.querySelectorAll(".key").forEach(e => e.remove());
    keyframes.forEach(function(k){
        const index = bones.indexOf(k.bone);
        const track = document.querySelector(`.track[data-index="${index}"]`);
        if(!track) return;

        const key = document.createElement("div");
        key.className = "key";
        key.style.left = (k.frame * 30 + 10) + "px";
        key.title = "Frame " + k.frame;
        key.onclick = function(){
            currentFrame = k.frame;
            slider.value = currentFrame;
            updateFrameUI();
            applyAnimation(currentFrame);
        };
        track.appendChild(key);
    });
}

function applyAnimation(frame){
    bones.forEach(function(bone){
        const keys = keyframes.filter(k => k.bone === bone).sort((a,b) => a.frame - b.frame);
        if(!keys.length) return;

        if(frame <= keys[0].frame){
            bone.position.copy(keys[0].position);
            bone.quaternion.copy(keys[0].quaternion);
            bone.scale.copy(keys[0].scale);
            return;
        }

        if(frame >= keys[keys.length-1].frame){
            bone.position.copy(keys[keys.length-1].position);
            bone.quaternion.copy(keys[keys.length-1].quaternion);
            bone.scale.copy(keys[keys.length-1].scale);
            return;
        }

        let previous = keys[0];
        let next = keys[keys.length-1];

        for(let i=0; i<keys.length; i++){
            if(keys[i].frame <= frame) previous = keys[i];
            if(keys[i].frame >= frame){
                next = keys[i];
                break;
            }
        }

        const alpha = (frame - previous.frame) / (next.frame - previous.frame);
        bone.position.lerpVectors(previous.position, next.position, alpha);
        bone.quaternion.slerpQuaternions(previous.quaternion, next.quaternion, alpha);
        bone.scale.lerpVectors(previous.scale, next.scale, alpha);
    });
}

slider.oninput = function(){
    currentFrame = Number(this.value);
    updateFrameUI();
    applyAnimation(currentFrame);
};

function updateFrameUI(){
    frameText.innerText = "Frame " + currentFrame;
}

const playBtn = document.getElementById("playBtn");

playBtn.onclick = function(){
    playing = !playing;
    if(playing){
        playBtn.innerText = "⏸ Pause";
        transform.detach();
    } else {
        playBtn.innerText = "▶ Play";
        if(selectedBone) transform.attach(selectedBone);
    }
};

document.getElementById("stopBtn").onclick = function(){
    playing = false;
    playBtn.innerText = "▶ Play";
    currentFrame = 0;
    slider.value = 0;
    updateFrameUI();
    applyAnimation(0);
};

document.getElementById("clearBtn").onclick = function(){
    keyframes = [];
    renderKeys();
};

document.getElementById("resetBtn").onclick = function(){
    camera.position.set(0, 3, 7);
    orbit.target.set(0, 1.5, 0);
    orbit.update();
};

let lastTime = performance.now();
let accumulator = 0;

function animate(){
    requestAnimationFrame(animate);
    const now = performance.now();
    const delta = now - lastTime;
    lastTime = now;

    if(playing){
        accumulator += delta;
        const frameTime = 1000 / FPS;
        if(accumulator >= frameTime){
            accumulator = 0;
            currentFrame++;
            if(currentFrame > MAX_FRAME) currentFrame = 0;
            slider.value = currentFrame;
            updateFrameUI();
            applyAnimation(currentFrame);
        }
    }

    orbit.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", function(){
    camera.aspect = viewport.clientWidth / viewport.clientHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(viewport.clientWidth, viewport.clientHeight);
});
</script>

</body>
</html>
