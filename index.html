<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MizaxEngine - Roblox Animation Studio</title>
    
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; background: #1e1e1e; color: #fff; user-select: none; }
        
        /* Top Bar ala Roblox Studio */
        #topbar {
            position: absolute; top: 0; left: 0; right: 0; height: 35px;
            background: #2d2d2d; border-bottom: 1px solid #3f3f3f;
            display: flex; align-items: center; justify-content: space-between; padding: 0 10px; z-index: 10;
            font-size: 12px;
        }
        .top-group { display: flex; gap: 5px; }
        .top-btn { background: #3d3d3d; border: 1px solid #555; color: #fff; padding: 4px 10px; cursor: pointer; border-radius: 3px; font-size: 11px; }
        .top-btn:active { background: #007acc; }

        /* Canvas Viewport */
        #canvas-container { position: absolute; top: 35px; bottom: 150px; left: 0; right: 0; }

        /* Panel Timeline Bawah ala Roblox Animation Editor */
        #anim-panel {
            position: absolute; bottom: 0; left: 0; right: 0; height: 150px;
            background: #252526; border-top: 1px solid #3f3f3f; display: flex; z-index: 10;
        }

        /* Kiri: Daftar Tulang / Hierarchy */
        #bone-tree {
            width: 35%; background: #1e1e1e; border-right: 1px solid #3f3f3f;
            overflow-y: auto; font-size: 11px; padding: 5px;
        }
        .bone-item {
            padding: 6px 8px; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            border-bottom: 1px solid #2a2a2a;
        }
        .bone-item:hover { background: #2a2d2e; }
        .bone-item.selected { background: #094771; color: #fff; font-weight: bold; }

        /* Kanan: Timeline & Keyframe Grid */
        #timeline-grid {
            flex: 1; background: #1e1e1e; position: relative; overflow-x: auto; overflow-y: hidden;
            display: flex; flex-direction: column;
        }
        .timeline-header {
            height: 25px; background: #2d2d2d; border-bottom: 1px solid #3f3f3f;
            display: flex; align-items: center; padding-left: 10px; font-size: 10px; color: #aaa;
        }
        .track-row {
            height: 28px; border-bottom: 1px solid #2a2a2a; display: flex; align-items: center; position: relative;
        }
        .keyframe-dot {
            width: 12px; height: 12px; background: #007acc; transform: rotate(45deg);
            position: absolute; cursor: pointer; border: 1px solid #fff;
        }

        /* Kontrol Bawah Timeline */
        #timeline-controls {
            position: absolute; bottom: 5px; left: 5px; right: 5px; height: 30px;
            display: flex; justify-content: space-between; align-items: center; background: #2d2d2d; padding: 0 10px; border-radius: 4px;
        }

        #loading {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8); border: 1px solid #007acc; padding: 15px 25px; color: #007acc;
            font-size: 13px; z-index: 30; border-radius: 5px;
        }
    </style>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
</head>
<body>

    <div id="loading">> MEMUAT RIG & MENGHIDUPKAN LAMPU...</div>

    <div id="topbar">
        <div class="top-group">
            <span style="font-weight: bold; color: #007acc;">Roblox Anim Studio</span>
            <button class="top-btn" onclick="setMode('rotate')">PUTAR (Rotate)</button>
            <button class="top-btn" onclick="setMode('translate')">GESER (Move)</button>
        </div>
        <div class="top-group">
            <button class="top-btn" style="background: #0e639c;" id="btn-keyframe">+ Keyframe</button>
            <button class="top-btn" onclick="resetCam()">Reset Kamera</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <div id="anim-panel">
        <div id="bone-tree">
            <div style="color: #777; padding: 5px;">Memuat Tulang...</div>
        </div>
        <div id="timeline-grid">
            <div class="timeline-header">0:00 / 1:00 (Frame Timeline Animasi)</div>
            <div id="tracks-container" style="flex: 1; overflow-y: auto; padding-bottom: 35px;"></div>
            
            <div id="timeline-controls">
                <button class="top-btn" id="btn-play">▶ Play</button>
                <div style="display: flex; align-items: center; gap: 8px; font-size: 11px;">
                    <span>Frame:</span>
                    <input type="range" id="timeline-slider" min="0" max="60" value="0" style="accent-color: #007acc;">
                    <span id="frame-num">0</span>
                </div>
                <button class="top-btn" onclick="clearKeys()" style="background: #552222;">Clear</button>
            </div>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, transform, loadedModel;
        let bonesList = [];
        let selectedBone = null;
        let keyframes = []; // Format: { frame, boneName, pos, rot }
        let isPlaying = false;
        let currentFrame = 0;

        // 1. SETUP SCENE & KAMERA
        const container = document.getElementById('canvas-container');
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x2d2d2d); // Abu-abu studio terang

        camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
        camera.position.set(0, 3, 6);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);

        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 2, 0);

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', (e) => { controls.enabled = !e.value; });

        function setMode(mode) { transform.setMode(mode); }
        function resetCam() { camera.position.set(0, 3, 6); controls.target.set(0, 2, 0); }

        // 2. PENCAHAYAAN TERANG BENDERANG (MULTI-DIRECTIONAL LIGHT)
        scene.add(new THREE.AmbientLight(0xffffff, 1.2)); // Terang merata
        
        const dirLight1 = new THREE.DirectionalLight(0xffffff, 1.5); // Depan Atas
        dirLight1.position.set(5, 10, 7);
        scene.add(dirLight1);

        const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.8); // Belakang Samping
        dirLight2.position.set(-5, 5, -5);
        scene.add(dirLight2);

        const floorGrid = new THREE.GridHelper(20, 20, 0x007acc, 0x444444);
        scene.add(floorGrid);

        // 3. LOAD FILE dummy.fbx DARI GITHUB
        const loader = new THREE.FBXLoader();
        loader.load('dummy.fbx', (object) => {
            loadedModel = object;
            loadedModel.scale.set(0.01, 0.01, 0.01); // Skala konversi standar FBX Roblox
            scene.add(loadedModel);

            // Perbaiki material supaya tidak gelap/hitam
            loadedModel.traverse((child) => {
                if (child.isMesh) {
                    child.material.metalness = 0.0;
                    child.material.roughness = 0.5;
                    child.material.needsUpdate = true;
                }
                if (child.isBone || child.type === 'Bone') {
                    bonesList.push(child);
                }
            });

            // Jika tidak terdeteksi objek berlabel Bone, ambil semua child group/mesh utama
            if (bonesList.length === 0) {
                loadedModel.traverse((child) => { if(child.isMesh || child.isGroup) bonesList.push(child); });
            }

            buildBoneTreeUI();
            if (bonesList.length > 0) selectBone(bonesList[0]);
            
            document.getElementById('loading').style.display = 'none';
        }, undefined, (err) => {
            document.getElementById('loading').innerText = "ERROR: File dummy.fbx tidak ditemukan di GitHub!";
            console.error(err);
        });

        // 4. BUILD UI HIERARKI TULANG (KIRI) & TRACKS (KANAN)
        function buildBoneTreeUI() {
            const treeEl = document.getElementById('bone-tree');
            const tracksEl = document.getElementById('tracks-container');
            treeEl.innerHTML = '';
            tracksEl.innerHTML = '';

            bonesList.forEach((bone, index) => {
                // Item Tulang di Kiri
                const item = document.createElement('div');
                item.className = 'bone-item';
                item.innerText = bone.name || `Part_${index}`;
                item.onclick = () => selectBone(bone);
                item.id = `ui-bone-${index}`;
                treeEl.appendChild(item);

                // Baris Track Timeline di Kanan
                const track = document.createElement('div');
                track.className = 'track-row';
                track.id = `track-${index}`;
                tracksEl.appendChild(track);
            });
        }

        function selectBone(bone) {
            selectedBone = bone;
            transform.attach(bone);

            // Highlight UI Kiri
            document.querySelectorAll('.bone-item').forEach(el => el.classList.remove('selected'));
            const idx = bonesList.indexOf(bone);
            if (idx !== -1) {
                const activeEl = document.getElementById(`ui-bone-${idx}`);
                if (activeEl) activeEl.classList.add('selected');
            }
        }

        // 5. SISTEM KEYFRAME & ANIMASI
        document.getElementById('btn-keyframe').addEventListener('click', () => {
            if (!selectedBone) return;
            const boneIdx = bonesList.indexOf(selectedBone);
            
            // Hapus keyframe lama di frame ini jika ada
            keyframes = keyframes.filter(k => !(k.frame === currentFrame && k.boneName === selectedBone.name));

            // Simpan posisi & rotasi baru
            keyframes.push({
                frame: currentFrame,
                boneName: selectedBone.name,
                boneIdx: boneIdx,
                pos: selectedBone.position.clone(),
                rot: selectedBone.quaternion.clone()
            });

            renderKeyframeDots();
            alert(`Keyframe tersimpan di '${selectedBone.name}' (Frame ${currentFrame})!`);
        });

        function renderKeyframeDots() {
            // Bersihkan titik lama
            document.querySelectorAll('.keyframe-dot').forEach(el => el.remove());

            keyframes.forEach(k => {
                const track = document.getElementById(`track-${k.boneIdx}`);
                if (track) {
                    const dot = document.createElement('div');
                    dot.className = 'keyframe-dot';
                    dot.style.left = (k.frame * 25) + 'px'; // Jarak antar frame di timeline
                    dot.style.top = '7px';
                    track.appendChild(dot);
                }
            });
        }

        const slider = document.getElementById('timeline-slider');
        slider.addEventListener('input', (e) => {
            currentFrame = parseInt(e.target.value);
            document.getElementById('frame-num').innerText = currentFrame;
            applyAnimation(currentFrame);
        });

        function applyAnimation(frame) {
            bonesList.forEach(bone => {
                const boneKeys = keyframes.filter(k => k.boneName === bone.name).sort((a,b) => a.frame - b.frame);
                if (boneKeys.length === 0) return;

                if (boneKeys.length === 1 || frame <= boneKeys[0].frame) {
                    if (frame >= boneKeys[0].frame) {
                        bone.position.copy(boneKeys[0].pos);
                        bone.quaternion.copy(boneKeys[0].rot);
                    }
                    return;
                }

                let prev = boneKeys[0];
                let next = boneKeys[boneKeys.length - 1];

                for (let i = 0; i < boneKeys.length; i++) {
                    if (boneKeys[i].frame <= frame) prev = boneKeys[i];
                    if (boneKeys[i].frame >= frame && boneKeys[i].frame < next.frame) next = boneKeys[i];
                }

                if (prev.frame === next.frame) {
                    bone.position.copy(prev.pos);
                    bone.quaternion.copy(prev.rot);
                } else {
                    const alpha = (frame - prev.frame) / (next.frame - prev.frame);
                    bone.position.lerpVectors(prev.pos, next.pos, alpha);
                    bone.quaternion.slerpQuaternions(prev.rot, next.rot, alpha);
                }
            });
        }

        // Play/Pause Animasi
        const btnPlay = document.getElementById('btn-play');
        btnPlay.addEventListener('click', () => {
            isPlaying = !isPlaying;
            btnPlay.innerText = isPlaying ? "⏸ Pause" : "▶ Play";
            if (isPlaying) transform.detach();
            else if (selectedBone) transform.attach(selectedBone);
        });

        function clearKeys() {
            keyframes = [];
            renderKeyframeDots();
            alert("Semua keyframe dihapus!");
        }

        // Loop Utama Render
        function animate() {
            requestAnimationFrame(animate);
            controls.update();

            if (isPlaying) {
                currentFrame = (currentFrame + 1) % 61;
                slider.value = currentFrame;
                document.getElementById('frame-num').innerText = currentFrame;
                applyAnimation(currentFrame);
            }

            renderer.render(scene, camera);
        }
        animate();

        // Responsive layar HP
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
