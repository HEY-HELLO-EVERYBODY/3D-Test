<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>MizaxEngine - Advanced R6 Rigged Studio</title>
    
    <!-- CSS CYBERPUNK MIZAX ENGINE (TAJAM & SERBA MONOSPACE) -->
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            font-family: monospace; 
            background: #080808; 
            color: #fff; 
            user-select: none; 
        }
        #canvas-container { width: 100vw; height: 100vh; }
        
        /* HEADER BAR */
        #header-bar {
            position: absolute; top: 12px; left: 12px;
            background: rgba(13, 13, 13, 0.9);
            border: 1px solid #ff2a2a;
            padding: 8px 12px;
            color: #ff2a2a;
            font-weight: bold;
            font-size: 11px;
            letter-spacing: 1px;
            z-index: 10;
        }

        /* UI PANEL KONTROL VIEWER (DARI SCRIPT TEMUAN LUKU - RE-STYLED CYBERPUNK) */
        #ui-panel {
            position: absolute;
            top: 50px;
            left: 12px;
            background: rgba(13, 13, 13, 0.9);
            padding: 12px 15px;
            border: 1px solid #ff2a2a; /* Siku Tajam Tanpa UICorner */
            width: 220px;
            box-shadow: 0 0 10px rgba(255, 42, 42, 0.2);
            z-index: 10;
        }
        #ui-panel h3 { 
            margin: 0 0 10px 0; 
            font-size: 12px; 
            color: #ff2a2a; 
            text-transform: uppercase; 
            letter-spacing: 1px; 
            border-bottom: 1px solid #ff2a2a;
            padding-bottom: 5px;
        }
        .control-group { margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .control-group label { font-size: 11px; color: #ccc; }
        .control-group input[type="checkbox"] { accent-color: #ff2a2a; cursor: pointer; }
        
        .btn-cyber {
            width: 100%;
            padding: 8px;
            margin-top: 4px;
            background: #1a0000;
            border: 1px solid #ff2a2a;
            color: #ff2a2a;
            font-family: monospace;
            font-weight: bold;
            font-size: 11px;
            cursor: pointer;
            letter-spacing: 1px;
        }
        .btn-cyber:active, .btn-cyber.active { background: #ff2a2a; color: #000; }

        /* TIMELINE CONTROL PANEL (GABUNGAN STUDIO ANIMASI) */
        #timeline-panel {
            position: absolute; bottom: 12px; left: 12px; right: 12px;
            background: rgba(13, 13, 13, 0.95); 
            border: 1px solid #ff2a2a;
            padding: 10px; box-sizing: border-box; 
            display: flex; flex-direction: column; gap: 8px;
            z-index: 10;
        }
        .btn-group { display: flex; gap: 6px; }

        #loading {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 13px;
            background: #000;
            color: #ff2a2a;
            border: 1px solid #ff2a2a;
            padding: 15px 25px;
            z-index: 20;
        }
    </style>

    <!-- LIBRARY THREE.JS -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/fflate@0.7.4/umd/index.min.js"></script>
</head>
<body>

    <div id="header-bar">MIZAX_ENGINE // R6 ANIMATION STUDIO</div>
    <div id="loading">> STATUS: MEMUAT RIG R6...</div>
    <div id="canvas-container"></div>

    <!-- PANEL CONTROLS TEMUAN MIZAX (GAYA CYBERPUNK) -->
    <div id="ui-panel">
        <h3>RIG CONTROLS</h3>
        <div class="control-group">
            <label for="toggle-wireframe">Wireframe</label>
            <input type="checkbox" id="toggle-wireframe">
        </div>
        <div class="control-group">
            <label for="toggle-skeleton">Lihat Tulang (Skeleton)</label>
            <input type="checkbox" id="toggle-skeleton">
        </div>
        <div class="control-group">
            <label for="toggle-autorotate">Putar Otomatis</label>
            <input type="checkbox" id="toggle-autorotate">
        </div>
        <div class="control-group">
            <label for="toggle-grid">Grid Baseplate</label>
            <input type="checkbox" id="toggle-grid" checked>
        </div>
        <button class="btn-cyber" id="btn-reset">RESET KAMERA</button>
    </div>

    <!-- PANEL STUDIO ANIMASI & KEYFRAME -->
    <div id="timeline-panel">
        <div class="btn-group">
            <button id="btn-translate" class="btn-cyber active" onclick="setMode('translate')">GESER</button>
            <button id="btn-rotate" class="btn-cyber" onclick="setMode('rotate')">PUTAR</button>
            <button id="btn-keyframe" class="btn-cyber" style="border-color: #00ff66; color: #00ff66;">+ KEYFRAME</button>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
            <span style="font-size: 11px; color: #aaa;">FRAME:</span>
            <input type="range" id="timeline" min="0" max="100" value="0" style="flex: 1; accent-color: #ff2a2a;">
            <span id="frame-val" style="font-size: 11px; color: #ff2a2a;">0</span>
        </div>

        <div class="btn-group">
            <button id="btn-play" class="btn-cyber" onclick="togglePlay()">▶ PLAY</button>
            <button class="btn-cyber" onclick="clearKeyframes()" style="border-color: #555; color: #888;">↺ CLEAR</button>
        </div>
    </div>

    <script>
        let scene, camera, renderer, controls, transform, loadedModel, skeletonHelper, gridHelper, mixer;
        const clock = new THREE.Clock();
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        // 1. INISIALISASI SCENE & KAMERA
        scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0d0d0d);

        camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 4, 8);

        renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // 2. KONTROL KAMERA & TRANSFORM GIZMO
        controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.target.set(0, 2, 0);

        transform = new THREE.TransformControls(camera, renderer.domElement);
        scene.add(transform);
        transform.addEventListener('dragging-changed', (e) => { controls.enabled = !e.value; });

        function setMode(mode) {
            transform.setMode(mode);
            document.getElementById('btn-translate').classList.toggle('active', mode === 'translate');
            document.getElementById('btn-rotate').classList.toggle('active', mode === 'rotate');
        }

        // 3. LIGHTING TERANG SINEMATIK
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(5, 10, 7.5);
        dirLight.castShadow = true;
        scene.add(dirLight);

        const redFill = new THREE.DirectionalLight(0xff2a2a, 0.6);
        redFill.position.set(-5, 5, -5);
        scene.add(redFill);

        // 4. GRID BASEPLATE CYBERPUNK
        gridHelper = new THREE.GridHelper(20, 20, 0xff2a2a, 0x333333);
        scene.add(gridHelper);

        // 5. LOADER MODEL FBX RIG R6
        const fbxLoader = new THREE.FBXLoader();
        
        // Panggil file 'dummy.fbx' di folder repo
        fbxLoader.load('dummy.fbx', (object) => {
            setupRigModel(object);
        }, undefined, (err) => {
            console.log("File 'dummy.fbx' belum diupload, membuat R6 Temporary.");
            createTemporaryR6();
        });

        function setupRigModel(object) {
            loadedModel = object;
            loadedModel.scale.set(0.01, 0.01, 0.01); // Skala standar FBX Roblox
            scene.add(loadedModel);

            // Fitur SkeletonHelper dari script temuan Mizax!
            skeletonHelper = new THREE.SkeletonHelper(loadedModel);
            skeletonHelper.visible = false;
            scene.add(skeletonHelper);

            // Cek Animasi bawaan jika ada
            if (object.animations && object.animations.length > 0) {
                mixer = new THREE.AnimationMixer(object);
                const action = mixer.clipAction(object.animations[0]);
                action.play();
            }

            transform.attach(loadedModel);
            document.getElementById('loading').style.display = 'none';
        }

        // R6 Sementara jika file dummy.fbx belum di-upload
        function createTemporaryR6() {
            const group = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.4 });
            
            const torso = new THREE.Mesh(new THREE.BoxGeometry(2, 2, 1), mat); torso.position.y = 3; group.add(torso);
            const head = new THREE.Mesh(new THREE.BoxGeometry(1.2, 1.2, 1.2), mat); head.position.y = 4.6; group.add(head);
            const lArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), mat); lArm.position.set(-1.5, 3, 0); group.add(lArm);
            const rArm = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), mat); rArm.position.set(1.5, 3, 0); group.add(rArm);
            const lLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), mat); lLeg.position.set(-0.5, 1, 0); group.add(lLeg);
            const rLeg = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 1), mat); rLeg.position.set(0.5, 1, 0); group.add(rLeg);

            loadedModel = group;
            scene.add(loadedModel);
            transform.attach(loadedModel);
            document.getElementById('loading').style.display = 'none';
        }

        // 6. RAYCASTER (KLIK / SENTUH BAGIAN TUBUH SENDIRI)
        window.addEventListener('pointerdown', (e) => {
            if (e.target.closest('#ui-panel') || e.target.closest('#timeline-panel') || e.target.tagName === 'BUTTON') return;

            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            if (loadedModel) {
                const intersects = raycaster.intersectObjects(loadedModel.children, true);
                if (intersects.length > 0) {
                    transform.attach(intersects[0].object);
                }
            }
        });

        // 7. KEYFRAME SYSTEM & INTERPOLASI
        let keyframes = [];
        let isPlaying = false;
        const timeline = document.getElementById('timeline');
        const frameVal = document.getElementById('frame-val');

        document.getElementById('btn-keyframe').addEventListener('click', () => {
            if (!transform.object) return;
            const currentFrame = parseInt(timeline.value);
            keyframes = keyframes.filter(k => !(k.frame === currentFrame && k.obj === transform.object));
            
            keyframes.push({
                frame: currentFrame,
                obj: transform.object,
                pos: transform.object.position.clone(),
                rot: transform.object.quaternion.clone()
            });
            keyframes.sort((a, b) => a.frame - b.frame);
            alert(`Keyframe tersimpan pada Frame ${currentFrame}!`);
        });

        function togglePlay() {
            isPlaying = !isPlaying;
            document.getElementById('btn-play').innerText = isPlaying ? "⏸ PAUSE" : "▶ PLAY";
            if (isPlaying) transform.detach();
            else if (loadedModel) transform.attach(loadedModel);
        }

        function clearKeyframes() {
            keyframes = [];
            timeline.value = 0;
            frameVal.innerText = "0";
            alert("Keyframe Dihapus!");
        }

        timeline.addEventListener('input', () => {
            frameVal.innerText = timeline.value;
            applyInterpolation(parseInt(timeline.value));
        });

        function applyInterpolation(frame) {
            if (keyframes.length === 0) return;
            // Filter keyframes per objek
            const objs = [...new Set(keyframes.map(k => k.obj))];
            
            objs.forEach(obj => {
                const objKeys = keyframes.filter(k => k.obj === obj);
                if (objKeys.length === 0) return;

                if (objKeys.length === 1) {
                    obj.position.copy(objKeys[0].pos);
                    obj.quaternion.copy(objKeys[0].rot);
                    return;
                }

                let prev = objKeys[0];
                let next = objKeys[objKeys.length - 1];

                for (let i = 0; i < objKeys.length; i++) {
                    if (objKeys[i].frame <= frame) prev = objKeys[i];
                    if (objKeys[i].frame >= frame && objKeys[i].frame < next.frame) next = objKeys[i];
                }

                if (prev.frame === next.frame) {
                    obj.position.copy(prev.pos);
                    obj.quaternion.copy(prev.rot);
                } else {
                    const alpha = (frame - prev.frame) / (next.frame - prev.frame);
                    obj.position.lerpVectors(prev.pos, next.pos, alpha);
                    obj.quaternion.slerpQuaternions(prev.rot, next.rot, alpha);
                }
            });
        }

        // --- EVENT LISTENERS PANEL TEMUAN MIZAX ---
        document.getElementById('toggle-wireframe').addEventListener('change', (e) => {
            if (!loadedModel) return;
            loadedModel.traverse((child) => {
                if (child.isMesh) child.material.wireframe = e.target.checked;
            });
        });

        document.getElementById('toggle-skeleton').addEventListener('change', (e) => {
            if (skeletonHelper) skeletonHelper.visible = e.target.checked;
        });

        document.getElementById('toggle-autorotate').addEventListener('change', (e) => {
            controls.autoRotate = e.target.checked;
            controls.autoRotateSpeed = 2.0;
        });

        document.getElementById('toggle-grid').addEventListener('change', (e) => {
            gridHelper.visible = e.target.checked;
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            camera.position.set(0, 4, 8);
            controls.target.set(0, 2, 0);
            controls.update();
        });

        // 8. ANIMATE LOOP
        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            
            if (mixer && !isPlaying) mixer.update(delta); // Muter animasi FBX jika ada
            controls.update();

            if (isPlaying) {
                let current = parseInt(timeline.value) + 1;
                if (current > 100) current = 0;
                timeline.value = current;
                frameVal.innerText = current;
                applyInterpolation(current);
            }

            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
